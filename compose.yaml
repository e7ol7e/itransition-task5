name: itransition-task5
services:
  observatory:
    build: .
    image: itransition-task5:prod
    restart: unless-stopped
    ports:
      - "127.0.0.1:5005:8080"
    read_only: true
    tmpfs:
      - /tmp:size=192m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 768m
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; assert b'ok' in urllib.request.urlopen('http://127.0.0.1:8080/healthz',timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
